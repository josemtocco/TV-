name: TV+ - atualizar M3U

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvplus-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar TV+
        run: python gerar_m3u.py

      - name: Validar saída
        run: |
          test -s "TV+.m3u"
          grep -q '^#EXTM3U' "TV+.m3u"
          echo "Canais: $(grep -c '^#EXTINF:' 'TV+.m3u')"

      - name: Commit da atualização
        run: |
          git config user.name "TV+ Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TV+.m3u" tvplus_state.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "TV+ - atualização automática"
            git push
          fi
